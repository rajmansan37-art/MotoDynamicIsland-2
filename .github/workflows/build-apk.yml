
name: Build Dynamic Island APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          ZIP=$(find . -name '*AndroidStudio-Project*.zip' | head -n 1)
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/project"
          PROJECT=$(find "$RUNNER_TEMP/project" -name settings.gradle.kts -printf '%h\n' | head -n 1)
          gradle -p "$PROJECT" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MotoDynamicIsland-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
